name: ETF四周期量化打分

on:
  schedule:
    # 每个交易日(周一至周五)北京时间15:30执行 (UTC 07:30)
    # 收盘后运行，确保当日数据完整
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行ETF打分
        env:
          PUSH_TYPE: ${{ secrets.PUSH_TYPE }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          PUSH_URL: ${{ secrets.PUSH_URL }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: |
          python "ETF四周期量化打分系统.py"

      - name: 部署报告到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'ETF打分报告 ${{ github.run_id }}'
